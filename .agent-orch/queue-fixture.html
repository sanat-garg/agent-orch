<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../public/app.css"><title>Queue fixture</title></head><body><div class="modal sheet" id="queueModal"><div class="modal-backdrop"></div><div class="modal-panel qs"><div class="sheet-grip"></div><div class="m-head"><div><h2 id="qTitle">Queue</h2><p class="m-sub">Drag a queued task to reorder (press and hold on touch, or Alt+↑/↓). Its dependents move with it.</p></div><button class="icon-btn" aria-label="Close">×</button></div><div class="m-body" id="qBody"><h3 class="dg-group">Up next · 16</h3><div class="q-list" id="qList"></div></div></div></div><script>
const list=document.querySelector('#qList');for(let i=0;i<16;i++){let depth=i%4;let b=document.createElement('button');b.className='tcard q-card'+(depth?' q-child':'');b.style.marginLeft=depth*16+'px';b.dataset.task=i+1;b.type='button';b.innerHTML='<span class="q-grip" aria-hidden="true">⠿</span><span class="tc-glyph waiting"></span><span class="tc-main"><span class="tc-title">Implement extremely long queue task title with unbroken/path/segments/for/mobile-layout '+i+'</span><span class="tc-sub"><span class="id">#'+(i+1)+'</span> · <span class="tc-after" role="link">after #123456789012345</span> · Waiting on dependency label with long contiguous text</span></span><span class="tc-tags"><span class="tc-tag urgent">Urgent</span><span class="tc-tag due">Due tomorrow</span><span class="tc-tag agent">Codex / very-long-model-identifier</span></span><span class="chev">›</span>';list.append(b)}
</script></body></html>
