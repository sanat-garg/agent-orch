<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f1e1c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Chat</title>
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/chat.css">
</head>
<body>
<!-- Chat (chat-mode.mjs, chat.js): a plain conversation with Claude's Opus models; all a "Chat only" account sees. -->
<div class="cm" id="cm">
  <aside class="cm-side" id="side" aria-label="Chats">
    <div class="cm-side-head">
      <span class="cm-brand">Chat</span>
      <button type="button" class="cm-icon" id="newChat" title="New chat (⌘⇧O)" aria-label="New chat">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 20h8M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <nav class="cm-list" id="list" aria-label="Your chats"></nav>
    <div class="cm-foot">
      <span class="cm-who" id="who"></span>
      <a class="cm-link" id="appLink" href="/" hidden>agent-orch</a>
      <button type="button" class="cm-link" id="signOut">Sign out</button>
    </div>
  </aside>
  <div class="cm-scrim" id="scrim" hidden></div>
  <main class="cm-main">
    <header class="cm-top">
      <button type="button" class="cm-icon cm-menu" id="openSide" aria-label="Show chats" aria-controls="side" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <h1 class="cm-title" id="title">New chat</h1>
      <button type="button" class="cm-icon cm-menu" id="newChat2" aria-label="New chat">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 20h8M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>
    <section class="cm-scroll" id="scroll" aria-live="polite">
      <div class="cm-thread" id="thread"></div>
      <div class="cm-empty" id="empty" hidden>
        <h2 id="hello">Hello</h2>
        <p>Ask anything. Claude can't browse the web or open files here, only talk.</p>
      </div>
    </section>
    <form class="cm-composer" id="composer">
      <div class="cm-box">
        <textarea id="input" rows="1" placeholder="Message Claude" aria-label="Message Claude" enterkeyhint="send"></textarea>
        <div class="cm-row">
          <label class="cm-model"><span class="cm-sr">Model</span><select id="model" aria-label="Model"></select>
            <svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </label>
          <button type="submit" class="cm-send" id="send" aria-label="Send" disabled>
            <svg class="i-send" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <svg class="i-stop" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2.5" fill="currentColor"/></svg>
          </button>
        </div>
      </div>
      <p class="cm-note" id="note" role="status"></p>
    </form>
  </main>
</div>
<script src="/vendor/marked.js"></script>
<script src="/vendor/purify.js"></script>
<script src="/chat.js"></script>
</body>
</html>
