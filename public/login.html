<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f1e1c">
<title>Sign in · agent-orch</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/login.css">
</head>
<body>
<main class="wrap">
  <form class="card" id="form" autocomplete="on" novalidate>
    <div class="brand">
      <img src="/icon.svg" alt="" width="44" height="44">
      <div>
        <h1>Welcome back</h1>
        <p class="sub">Sign in to Claude Code on <span id="host">your server</span></p>
      </div>
    </div>

    <!-- Lets password managers save this login under a name. -->
    <input type="text" name="username" autocomplete="username" value="claude" hidden>

    <label for="pw">Password</label>
    <div class="field">
      <input id="pw" name="password" type="password" autocomplete="current-password"
             placeholder="Enter your password" autofocus required spellcheck="false">
      <button type="button" class="eye" id="eye" aria-label="Show password" title="Show password">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path id="slash" d="M4 4l16 16" stroke="currentColor" stroke-width="1.8" /></svg>
      </button>
    </div>
    <p class="hint" id="caps" hidden>Caps Lock is on</p>

    <label class="check">
      <input type="checkbox" id="remember" checked>
      <span>Keep me signed in for 30 days</span>
    </label>

    <p class="error" id="error" role="alert" hidden></p>

    <button class="primary" id="submit" type="submit">
      <span class="label">Sign in</span>
      <span class="spinner" aria-hidden="true"></span>
    </button>

    <p class="foot">Forgot it? SSH in and run<br><code>node ~/agent-orch/server.mjs set-password &lt;new&gt;</code></p>
  </form>
</main>
<script>
const $ = (id) => document.getElementById(id);
$('host').textContent = location.hostname.replace(/\.sslip\.io$/, '').replace(/-/g, '.');

const pw = $('pw'), eye = $('eye'), slash = $('slash');
slash.style.display = 'none';
eye.addEventListener('click', () => {
  const show = pw.type === 'password';
  pw.type = show ? 'text' : 'password';
  slash.style.display = show ? '' : 'none';
  eye.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  pw.focus();
});
pw.addEventListener('keyup', (e) => { $('caps').hidden = !e.getModifierState?.('CapsLock'); });
pw.addEventListener('input', () => { $('error').hidden = true; pw.classList.remove('bad'); });

let lockTimer;
function showError(text) {
  const el = $('error');
  el.textContent = text;
  el.hidden = false;
  pw.classList.add('bad');
  const card = $('form');
  card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
}
function lockout(sec) {
  const btn = $('submit');
  btn.disabled = true;
  clearTimeout(lockTimer);
  const tick = () => {
    if (sec <= 0) { clearTimeout(lockTimer); btn.disabled = false; $('error').hidden = true; pw.focus(); return; }
    const m = Math.floor(sec / 60), s = String(sec % 60).padStart(2, '0');
    $('error').textContent = `Too many attempts. Try again in ${m}:${s}.`;
    $('error').hidden = false;
    sec--;
    lockTimer = setTimeout(tick, 1000);
  };
  tick();
}

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!pw.value) { showError('Enter your password to continue.'); pw.focus(); return; }
  const btn = $('submit');
  btn.classList.add('loading'); btn.disabled = true;
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw.value, remember: $('remember').checked }),
    });
    const body = await r.json().catch(() => ({}));
    if (r.ok) { btn.querySelector('.label').textContent = 'Signed in'; location.replace('/'); return; }
    if (r.status === 429) { btn.classList.remove('loading'); showError(''); return lockout(body.retryInSec || 900); }
    showError(body.attemptsLeft > 0 && body.attemptsLeft < 3
      ? `That password isn't right. ${body.attemptsLeft} ${body.attemptsLeft === 1 ? 'try' : 'tries'} left before a 15-minute lock.`
      : "That password isn't right. Try again.");
    pw.select();
  } catch {
    showError("Can't reach the server. Check your connection and try again.");
  }
  btn.classList.remove('loading'); btn.disabled = false;
});
</script>
</body>
</html>
